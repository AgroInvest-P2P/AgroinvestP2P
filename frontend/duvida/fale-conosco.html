<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fale Conosco - Agroinvest</title>
  <link rel="stylesheet" href="../css/fale-conosco.css">
</head>

<body>
  <nav class="navbar">
    <div class="marca">
      <p class="titulo">Agroinvest</p>
      <p class="subtitulo">Suporte ao Cliente</p>
    </div>
    <div class="info-user">
      <a href="#" onclick="window.history.back(); return false;" style="color: #00a859; font-weight: bold; text-decoration: none; font-size: 14px; margin-right: 20px;">← Voltar</a>
      <a href="../login/login.html" style="color: #666; font-weight: bold; text-decoration: none; font-size: 14px;">Sair (Login)</a>
    </div>
  </nav>

  <div class="container-contato">
    <div class="contato-box">
      <h1>Fale Conosco</h1>
      <p class="contato-sub">Tem alguma dúvida ou problema? Envie uma mensagem para a nossa equipe técnica.</p>

      <form id="form-contato" onsubmit="enviarMensagem(event)">
        
        <div class="campo-grupo">
          <label for="nome-contato">Nome Completo</label>
          <input type="text" id="nome-contato" placeholder="Digite seu nome" required>
        </div>

        <div class="campo-grupo">
          <label for="email-contato">E-mail de Contato</label>
          <input type="email" id="email-contato" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="campo-grupo">
          <label for="perfil-contato">Você é:</label>
          <select id="perfil-contato" required>
            <option value="investidor">Investidor</option>
            <option value="produtor">Pequeno Produtor / Agricultor</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="campo-grupo">
          <label for="mensagem-contato">Mensagem</label>
          <textarea id="mensagem-contato" rows="5" placeholder="Escreva aqui sua dúvida, crítica ou sugestão..." required></textarea>
        </div>

        <button type="submit" class="btn-enviar-contato">Enviar Mensagem</button>
      </form>
      
      <p id="feedback-contato" class="mensagem-sucesso"></p>
    </div>
  </div>

  <script>
    function enviarMensagem(event) {
      event.preventDefault(); 
      
      let nome = document.getElementById("nome-contato").value;
      let feedback = document.getElementById("feedback-contato");
      
      feedback.innerHTML = `Obrigado, ${nome}! Sua mensagem foi enviada com sucesso.`;
      document.getElementById("form-contato").reset();
    }
  </script>
</body>

</html>
