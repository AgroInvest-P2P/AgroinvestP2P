<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Produtor - Agroinvest</title>
  <link rel="stylesheet" href="./agricultor.css">
</head>

<body>
  <nav class="navbar">
    <div class="marca">
      <p class="titulo">Agroinvest</p>
      <p class="subtitulo">Painel do Produtor</p>
    </div>
    <div class="info-user">
      <a href="../duvida/fale-conosco.html" class="btn-link-nav">Suporte</a>
      <a href="../login/login.html" class="btn-link-nav" style="margin-right: 15px;">Sair</a>
      <button class="btn-novo-projeto" onclick="abrirModal()">
        <span class="mais-icone">+</span> Cadastrar Investimento
      </button>
      <div class="perfil-produtor">AG</div>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <p>Projetos Ativos</p>
      <div class="conteudo-valor">
        <span class="valor-grande" id="card-projetos-ativos">0</span>
        <span class="indicador-positivo">🌱</span>
      </div>
    </div>
    <div class="card">
      <p>Total Captado</p>
      <div class="conteudo-valor">
        <span class="valor-real-verde" id="card-total-captado">R$ 0</span>
      </div>
    </div>
    <div class="card">
      <p>Investidores</p>
      <div class="conteudo-valor">
        <span class="valor-grande" id="card-total-investidores">0</span>
      </div>
    </div>
    <div class="card">
      <p>Taxa de Sucesso</p>
      <div class="conteudo-valor">
        <span class="valor-grande-positivo" id="card-taxa-sucesso">100%</span>
        <span class="indicador-positivo">↗</span>
      </div>
    </div>
  </div>

  <h1>Meus Projetos</h1>

  <div class="lista-projetos" id="lista-projetos-container">
    <!-- Os projetos serão carregados dinamicamente via Javascript -->
  </div>

  <!-- MODAL DE CADASTRO DE NOVO PROJETO -->
  <div id="modal-cadastro" class="modal">
    <div class="modal-conteudo">
      <span class="fechar-modal" onclick="fecharModal()">&times;</span>
      <h2>Cadastrar Novo Projeto</h2>
      
      <form id="form-cadastro" onsubmit="salvarNovoProjeto(event)">
        <div class="campo-grupo">
          <label for="titulo-projeto">Título do Projeto</label>
          <input type="text" id="titulo-projeto" required placeholder="Ex: Plantio de Soja Orgânica 2026">
        </div>
        
        <div class="campo-grupo">
          <label for="roi-projeto">Retorno Projetado (ROI %)</label>
          <input type="number" step="0.1" id="roi-projeto" required placeholder="Ex: 18.5">
        </div>
        
        <div class="campo-grupo">
          <label for="meta-projeto">Meta de Captação (R$)</label>
          <input type="number" id="meta-projeto" required placeholder="Ex: 170000">
        </div>
        
        <div class="campo-grupo">
          <label for="local-projeto">Localização (Cidade - Estado)</label>
          <input type="text" id="local-projeto" required placeholder="Ex: Rio Verde - GO">
        </div>
        
        <div class="campo-grupo">
          <label for="prazo-projeto">Prazo para Retorno</label>
          <input type="text" id="prazo-projeto" required placeholder="Ex: Junho 2026">
        </div>
        
        <div class="campo-grupo">
          <label for="imagem-projeto">Tipo de Cultivo (Imagem)</label>
          <select id="imagem-projeto">
            <option value="../img/soja.png">Soja</option>
            <option value="../img/milho.png">Milho</option>
            <option value="../img/horta.png">Horta / Legumes</option>
          </select>
        </div>

        <button type="submit" class="btn-salvar">Salvar Projeto</button>
      </form>
    </div>
  </div>

  <!-- Inclusão dos Scripts Javascript -->
  <script src="agricultor.js"></script>
</body>

</html>
